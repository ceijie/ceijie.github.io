<html lang="en">
<head>

<title>ceijie</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    padding:20px;
}

.container{
    width:420px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:30px;
    padding:35px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:auto;
    background:#1DB954;
    color:white;
    font-size:42px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}

.username{
    color:white;
    text-align:center;
    font-size:36px;
    margin:20px 0;
}

.card{
    display:block;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    transition:.3s;
}

.card:hover{
    background:#1DB954;
    color:white;
    transform:translateY(-5px);
}

.card-title{
    font-size:22px;
    font-weight:bold;
}

.card-text{
    color:#666;
}

.footer{
    text-align:center;
    color:#ddd;
    margin-top:25px;
}
</style>

</head>

    </a>

tify.com/artist/5IWDjeXR2bCQpoaR3JK5IW

        <div class="card-text">Visit my artist profile</div>

        ceijie.github.io
    </div>

</div>

</html>
