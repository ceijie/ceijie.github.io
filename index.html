<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ceijie</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesomee>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#b8b8b8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:450px;
    background:#eeeeee;
    border-radius:32px;
    padding:40px 30px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.logo{
    width:120px;
    height:120px;
    background:black;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:20px auto;
    font-size:42px;
    font-weight:bold;
}

.username{
    text-align:center;
    font-size:42px;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    text-decoration:none;
    color:black;
    display:block;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.card-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.card-text{
    color:#666;
}

.socials{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:25px;
}

.socials a{
    color:black;
    font-size:34px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CJ</div>

    <div class="username">@ceijie</div>

    <div class="subtitle">
        Artist • Creator • Builder
    </div>

    <a class="card" href.com/track/5D2xuzFaj8Y08QdH7PZpvK
        <div class="card-title">🎵 Identity</div>
        <div class="card-text">Listen on Spotify</div>
